project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - services.qmd
    - trust.qmd
    - about.qmd
    - privacy.qmd
    - terms.qmd
  resources:
    - assets/**

website:
  title: "Amanah Digital"
  site-url: "https://amanah-digital-pk.github.io"
  favicon: assets/brand/amanah-mark-favicon.svg
  page-footer:
    left: "© 2026 Amanah Digital"
    center: "Every service. Every city. Built on trust."
    right:
      - href: privacy.qmd
        text: Privacy
      - href: terms.qmd
        text: Terms

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    smooth-scroll: true
    anchor-sections: false
    include-before-body: assets/includes/site-header.html
    include-in-header:
      text: |
        <meta name="theme-color" content="#0F5D46">
        <meta name="description" content="Amanah is Pakistan's trusted workforce and services network.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <script>
          (function(){
            var l=localStorage.getItem('amanah-language')||'ur';
            var d=document.documentElement;
            d.dataset.lang=l;
            d.lang=l==='ur'?'ur':'en';
            d.dir=l==='ur'?'rtl':'ltr';
            d.classList.add('language-initialised');
          })();
        </script>
        <script defer src="assets/js/language.js"></script>

execute:
  freeze: auto
